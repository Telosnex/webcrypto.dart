name: Kiln check

on:
  pull_request:
    branches: [main]
    paths:
      - native_artifacts/prebuilt.json
      - native_artifacts/source_excludes.txt
      - .github/workflows/kiln_check.yml
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kiln-check:
    uses: Telosnex/telosnex_ci_tools/.github/workflows/kiln_check.yml@2b3e8c2aeffd68d7aeb371c35e58699357aefffc # v0.5.25
