name: Kiln check

on:
  pull_request:
    branches: [telosnex_main]
    paths:
      - native_artifacts/prebuilt.json
      - native_artifacts/source_excludes.txt
      - .github/workflows/kiln_check.yml
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kiln-check:
    uses: Telosnex/telosnex_ci_tools/.github/workflows/kiln_check.yml@0e3d782cce29ab6f9fdb2fa6d796bcb365882407 # v0.1.2
