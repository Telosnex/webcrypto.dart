name: Integration

on:
  push:
    branches: [main, 'ci/**']
  schedule:
    - cron: '29 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # The VM tests against the released BoringSSL library of each platform,
  # then the demo app's integration test (Flutter desktop). The jobs share
  # the steps of the first (YAML anchor).
  desktop-linux-x64:
    name: Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DEVICE: linux
    steps: &native_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev xvfb > /dev/null
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@bba81d85dab7716cc288df9877812dd3299ff11e # v0.5.14
      - run: flutter pub get
      - run: dart test --exclude-tags browser-interop -p vm -r expanded
      - name: Demo app integration test
        working-directory: example/webcrypto_demo_flutter_app
        run: |
          flutter pub get
          run=(flutter test integration_test/webcrypto_test.dart -d "$DEVICE" --timeout 5m -r expanded)
          if [[ "$RUNNER_OS" == Linux ]]; then run=(xvfb-run -a "${run[@]}"); fi
          "${run[@]}"

  desktop-linux-arm64:
    name: Linux ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    env:
      DEVICE: linux
    steps: *native_steps

  desktop-macos-arm64:
    name: macOS ARM64
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVICE: macos
    steps: *native_steps

  desktop-windows-x64:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      DEVICE: windows
    steps: *native_steps

  desktop-windows-arm64:
    name: Windows ARM64
    runs-on: windows-11-arm
    timeout-minutes: 40
    env:
      DEVICE: windows
    steps: *native_steps

  # The jobs share the steps of the first (YAML anchor).
  web-linux-chrome-dart2js:
    name: Web Linux x64 Chrome dart2js
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BROWSER: chrome
      COMPILER: dart2js
    steps: &web_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@bba81d85dab7716cc288df9877812dd3299ff11e # v0.5.14
      - run: flutter pub get
      - uses: Telosnex/telosnex_ci_tools/actions/dart-test-browser@bba81d85dab7716cc288df9877812dd3299ff11e # v0.5.14
        with:
          platform: ${{ env.BROWSER }}
          compiler: ${{ env.COMPILER }}
          args: --exclude-tags browser-interop

  web-linux-chrome-dart2wasm:
    name: Web Linux x64 Chrome dart2wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BROWSER: chrome
      COMPILER: dart2wasm
    steps: *web_steps

  web-linux-firefox-dart2js:
    name: Web Linux x64 Firefox dart2js
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BROWSER: firefox
      COMPILER: dart2js
    steps: *web_steps

  web-linux-firefox-dart2wasm:
    name: Web Linux x64 Firefox dart2wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BROWSER: firefox
      COMPILER: dart2wasm
    steps: *web_steps

  web-macos-safari-dart2js:
    name: Web macOS ARM64 Safari dart2js
    runs-on: macos-26
    timeout-minutes: 30
    env:
      BROWSER: safari
      COMPILER: dart2js
    steps: *web_steps

  ios:
    name: iOS ARM64 simulator
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@bba81d85dab7716cc288df9877812dd3299ff11e # v0.5.14
      - run: flutter pub get
      - uses: Telosnex/telosnex_ci_tools/actions/ios-flutter-test@bba81d85dab7716cc288df9877812dd3299ff11e # v0.5.14
        with:
          working-directory: example/webcrypto_demo_flutter_app
          target: integration_test/webcrypto_test.dart
          args: --timeout 5m

  android:
    name: Android x64 emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@bba81d85dab7716cc288df9877812dd3299ff11e # v0.5.14
      - run: flutter pub get
      - uses: Telosnex/telosnex_ci_tools/actions/android-emulator@bba81d85dab7716cc288df9877812dd3299ff11e # v0.5.14
        id: emulator
        with:
          api-level: '36'
      - name: Demo app integration test
        working-directory: example/webcrypto_demo_flutter_app
        env:
          SERIAL: ${{ steps.emulator.outputs.serial }}
        run: |
          flutter pub get
          flutter test integration_test/webcrypto_test.dart -d "$SERIAL" --timeout 5m -r expanded

  # The demo app's integration test on arm64 Android.
  # Built on x64 (Google builds no arm64 Linux Android build tools), run in
  # arm64 Android 15 in a container (actions/android-arm64-container).
  test-apks:
    name: Test APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@bba81d85dab7716cc288df9877812dd3299ff11e # v0.5.14
      - uses: Telosnex/telosnex_ci_tools/actions/android-test-apks@bba81d85dab7716cc288df9877812dd3299ff11e # v0.5.14
        with:
          working-directory: example/webcrypto_demo_flutter_app
          targets: integration_test/webcrypto_test.dart

  android-arm64:
    name: Android ARM64 container
    needs: test-apks
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@bba81d85dab7716cc288df9877812dd3299ff11e # v0.5.14
      - uses: Telosnex/telosnex_ci_tools/actions/download-artifact@bba81d85dab7716cc288df9877812dd3299ff11e # v0.5.14
        with:
          name: android-test-apks
          path: ${{ runner.temp }}/apks
      - uses: Telosnex/telosnex_ci_tools/actions/android-arm64-container@bba81d85dab7716cc288df9877812dd3299ff11e # v0.5.14
        with:
          apks: ${{ runner.temp }}/apks
